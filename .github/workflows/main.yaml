name: build and push to private registry

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build-and-push:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version: "=1.20"

      - name: OIDC token
        id: docker_oidc
        uses: docker/oidc-action@96ba694c64860c7209bcd1ede7d698c71564ef78 # v1.2.0
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_ID }}

      - name: Docker OIDC login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: rocketchat
          password: ${{ steps.docker_oidc.outputs.token }}

      - uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: ${{ github.workspace }}
          platforms: linux/amd64
          push: true
          tags: rocketchat/redis-backup-sidecar:${{github.sha}}
